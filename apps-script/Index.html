<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f3f7fa;
      color: #1f2933;
      font-family: Arial, Helvetica, sans-serif;
    }

    h1 {
      margin: 0 0 8px;
      color: #073a55;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin: 18px 0;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 8px 0 14px;
      flex-wrap: wrap;
    }

    .tab {
      color: #0b4f71;
      background: #e8f4f8;
    }

    .tab.active {
      color: #fff;
      background: #0b4f71;
    }

    button {
      padding: 10px 14px;
      color: #fff;
      background: #0b4f71;
      border: 0;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #15a085;
    }

    button.secondary {
      color: #0b4f71;
      background: #e8f4f8;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    table {
      width: 100%;
      background: #fff;
      border-collapse: collapse;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(7, 58, 85, 0.11);
    }

    th,
    td {
      padding: 11px 10px;
      border-bottom: 1px solid #d8e3ea;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: #fff;
      background: #073a55;
      font-size: 13px;
    }

    .small {
      color: #5c6b73;
      font-size: 12px;
    }

    .warning {
      color: #9a3412;
      font-size: 12px;
      font-weight: 700;
    }

    .status {
      margin: 10px 0;
      color: #5c6b73;
      font-weight: 700;
    }

    .attachments a {
      display: block;
      margin: 3px 0;
      color: #0b4f71;
      font-weight: 700;
      text-decoration: none;
    }

    select {
      width: 100%;
      max-width: 260px;
      margin: 3px 0 8px;
      padding: 7px 8px;
      border: 1px solid #b8cbd6;
      border-radius: 8px;
      background: #fff;
    }

    label {
      display: block;
      color: #5c6b73;
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <h1>Enviar horarios PDF</h1>
  <div class="small">Revisa primero los PDFs generados. Después envía uno a uno o selecciona varios.</div>

  <div class="toolbar">
    <button onclick="loadRows()">Cargar lista</button>
    <button onclick="sendSelectedRows()">Enviar seleccionados</button>
  </div>

  <div id="status" class="status"></div>
  <div id="app"></div>

  <script>
    let rows = [];
    let professorOptions = [];
    let classOptions = [];
    let activeSheet = 'Primaria';

    function setStatus(message) {
      document.getElementById('status').textContent = message || '';
    }

    function loadRows() {
      setStatus('Cargando lista...');
      google.script.run
        .withSuccessHandler((data) => {
          rows = data.rows;
          professorOptions = data.professorOptions;
          classOptions = data.classOptions;
          if (!rows.some((row) => row.sheetName === activeSheet)) {
            activeSheet = sheetNames()[0] || 'Primaria';
          }
          render();
          setStatus('Lista cargada: ' + rows.length + ' profesores.');
        })
        .withFailureHandler(showError)
        .getRows();
    }

    function render() {
      const visibleRows = rows.filter((row) => row.sheetName === activeSheet);
      const html = [
        tabsHtml(),
        '<table>',
        '<thead><tr><th></th><th>Profesor</th><th>Email</th><th>Tutoría</th><th>Archivos a enviar</th><th>PDFs previstos</th><th>Previsualización</th><th>Acciones</th></tr></thead>',
        '<tbody>'
      ];
      visibleRows.forEach((row) => {
        const hasAttachments = selectedAttachments(row).length > 0;
        html.push('<tr>');
        html.push('<td><input type="checkbox" value="' + escapeHtml(row.id) + '" ' + (hasAttachments ? '' : 'disabled') + '></td>');
        html.push('<td><strong>' + escapeHtml(row.profesor) + '</strong>' + warningsHtml(row) + '</td>');
        html.push('<td>' + escapeHtml(row.email) + '</td>');
        html.push('<td>' + escapeHtml(row.tutorDe || '') + '</td>');
        html.push('<td>' + selectorsHtml(row) + '</td>');
        html.push('<td id="planned-' + escapeHtml(row.id) + '">' + plannedAttachmentsHtml(row) + '</td>');
        html.push('<td class="attachments" id="preview-' + escapeHtml(row.id) + '"></td>');
        html.push('<td><button class="secondary" data-action="preview" data-row="' + escapeHtml(row.id) + '" onclick="previewRow(\'' + escapeJs(row.id) + '\')" ' + (hasAttachments ? '' : 'disabled') + '>Generar/ver PDF</button> <button data-action="send" data-row="' + escapeHtml(row.id) + '" onclick="sendRow(\'' + escapeJs(row.id) + '\')" ' + (hasAttachments ? '' : 'disabled') + '>Enviar</button></td>');
        html.push('</tr>');
      });
      html.push('</tbody></table>');
      document.getElementById('app').innerHTML = html.join('');
    }

    function tabsHtml() {
      return '<div class="tabs">' + sheetNames().map((sheetName) => {
        const count = rows.filter((row) => row.sheetName === sheetName).length;
        const active = sheetName === activeSheet ? ' active' : '';
        return '<button class="tab' + active + '" onclick="setActiveSheet(\'' + escapeJs(sheetName) + '\')">' + escapeHtml(sheetName + ' (' + count + ')') + '</button>';
      }).join('') + '</div>';
    }

    function sheetNames() {
      const names = [];
      rows.forEach((row) => {
        if (names.indexOf(row.sheetName) === -1) names.push(row.sheetName);
      });
      return names;
    }

    function setActiveSheet(sheetName) {
      activeSheet = sheetName;
      render();
      setStatus('Mostrando ' + sheetName + '.');
    }

    function selectorsHtml(row) {
      return [
        '<label for="professor-' + escapeHtml(row.id) + '">Horario profesor</label>',
        '<select id="professor-' + escapeHtml(row.id) + '" onchange="selectionChanged(\'' + escapeJs(row.id) + '\')">',
        '<option value="">No enviar horario de profesor</option>',
        professorOptions.map((option) => optionHtml(option, row.selectedProfessorPath)).join(''),
        '</select>',
        '<label for="class-' + escapeHtml(row.id) + '">Horario grupo tutor</label>',
        '<select id="class-' + escapeHtml(row.id) + '" onchange="selectionChanged(\'' + escapeJs(row.id) + '\')">',
        '<option value="">No enviar horario de grupo</option>',
        classOptions.map((option) => optionHtml(option, row.selectedClassPath)).join(''),
        '</select>'
      ].join('');
    }

    function optionHtml(option, selectedPath) {
      return '<option value="' + escapeHtml(option.path) + '" ' + (option.path === selectedPath ? 'selected' : '') + '>' + escapeHtml(option.title) + '</option>';
    }

    function selectionChanged(rowId) {
      const row = rowById(rowId);
      const overrides = currentOverrides(rowId);
      row.selectedProfessorPath = overrides.professorPath;
      row.selectedClassPath = overrides.classPath;
      const planned = document.getElementById('planned-' + rowId);
      planned.innerHTML = plannedAttachmentsHtml(row);
      document.getElementById('preview-' + rowId).innerHTML = '';
      const hasAttachments = selectedAttachments(row).length > 0;
      document.querySelector('input[type="checkbox"][value="' + cssEscape(rowId) + '"]').disabled = !hasAttachments;
      document.querySelector('button[data-action="preview"][data-row="' + cssEscape(rowId) + '"]').disabled = !hasAttachments;
      document.querySelector('button[data-action="send"][data-row="' + cssEscape(rowId) + '"]').disabled = !hasAttachments;
    }

    function plannedAttachmentsHtml(row) {
      const attachments = selectedAttachments(row);
      return attachments.length ? attachments.map((item) => escapeHtml(item.label + ': ' + item.fileName)).join('<br>') : '<span class="warning">No se enviará nada</span>';
    }

    function selectedAttachments(row) {
      const overrides = currentOverrides(row.id);
      const attachments = [];
      if (overrides.professorPath) {
        attachments.push({ label: 'Horario profesor', fileName: 'profesor-' + safeName(row.profesor) + '.pdf' });
      }
      if (overrides.classPath) {
        attachments.push({ label: 'Horario grupo tutor', fileName: 'grupo-' + safeName(row.tutorDe || 'grupo') + '.pdf' });
      }
      return attachments;
    }

    function currentOverrides(rowId) {
      const professor = document.getElementById('professor-' + rowId);
      const classSelect = document.getElementById('class-' + rowId);
      const row = rowById(rowId);
      return {
        professorPath: professor ? professor.value : row.selectedProfessorPath,
        classPath: classSelect ? classSelect.value : row.selectedClassPath
      };
    }

    function rowById(rowId) {
      return rows.find((row) => row.id === String(rowId));
    }

    function warningsHtml(row) {
      if (!row.warnings.length) return '';
      return '<div class="warning">' + row.warnings.map(escapeHtml).join('<br>') + '</div>';
    }

    function previewRow(rowId) {
      setStatus('Generando PDF...');
      google.script.run
        .withSuccessHandler((files) => {
          const target = document.getElementById('preview-' + rowId);
          target.innerHTML = files.map((file) => '<a href="' + escapeHtml(file.url) + '" target="_blank">' + escapeHtml(file.label + ': ' + file.fileName) + '</a>').join('');
          setStatus('PDF generado. Revísalo antes de enviar.');
        })
        .withFailureHandler(showError)
        .generatePreview(rowId, currentOverrides(rowId));
    }

    function sendRow(rowId) {
      if (!confirm('¿Enviar los PDF de este profesor?')) return;
      setStatus('Enviando email...');
      google.script.run
        .withSuccessHandler((result) => setStatus('Enviado a ' + result.email + ': ' + result.attachments.join(', ')))
        .withFailureHandler(showError)
        .sendRow(rowId, currentOverrides(rowId));
    }

    function sendSelectedRows() {
      const items = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map((input) => ({
        rowId: input.value,
        overrides: currentOverrides(input.value)
      }));
      if (!items.length) {
        alert('Selecciona al menos un profesor.');
        return;
      }
      if (!confirm('¿Enviar los PDF a ' + items.length + ' profesores?')) return;
      setStatus('Enviando seleccionados...');
      google.script.run
        .withSuccessHandler((results) => setStatus('Envíos completados: ' + results.length))
        .withFailureHandler(showError)
        .sendSelected(items);
    }

    function showError(error) {
      setStatus('ERROR: ' + (error.message || error));
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
    }

    function escapeJs(value) {
      return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function cssEscape(value) {
      return String(value || '').replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    }

    function safeName(value) {
      return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'horario';
    }

    loadRows();
  </script>
</body>
</html>
