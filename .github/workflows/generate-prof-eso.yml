name: Generar horarios ESO desde PDF

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/horarios-listado.pdf'
      - 'docs/horarios-listado.trigger'
      - 'scripts/generate-prof-eso-from-pdf.py'
      - '.github/workflows/generate-prof-eso.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Generar horarios de profesores ESO/Bach
        run: |
          python3 scripts/generate-prof-eso-from-pdf.py \
            --pdf docs/horarios-listado.pdf \
            --output prof-eso \
            --class-folder clases-eso \
            --pdftotext "$(command -v pdftotext)"
          cp untis.css prof-eso/untis.css
          python3 scripts/prepare-horarios.py --folder prof-eso
          python3 scripts/color-lessons.py --root .

      - name: Publicar cambios generados
        run: |
          if git diff --quiet; then
            echo "No hay cambios en los horarios ESO."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prof-eso
          git commit -m "Actualizar horarios ESO desde PDF [skip ci]"
          git push
